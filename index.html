<style>
:root{--fs:1;--serif:"Laila","Noto Serif Devanagari","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;--bg1:#1b1544;--bg2:#35347a;--bg3:#4f51a3;--gl:rgba(255,255,255,.13);--gl2:rgba(255,255,255,.24);--bd:rgba(255,255,255,.26);--tx:#f6f4ff;--mu:#dcd8fa;--ac:#dcd5ff;--ac2:#a99bff;--dk:#1b1135;--dkt:#fff;--sh:0 12px 32px rgba(8,4,36,.35);--tk:rgba(255,255,255,.22);--fb:linear-gradient(145deg,#fff,#d9d3ff);--fc:#1b1135;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.pt{flex:1;min-width:0}.pt b{display:block;font-weight:600}.cv{color:var(--mu)}
.it{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px dashed var(--bd)}
.it span{flex:1}.it.d span{text-decoration:line-through;color:var(--mu)}
.hero2{position:relative;overflow:hidden;border-radius:34px;padding:22px 14px 14px;margin-bottom:14px;display:flex;flex-direction:column;justify-content:space-between;gap:56px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));box-shadow:var(--sh);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.hero2 .hc{position:relative;z-index:2;border-radius:24px;padding:16px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fl{animation:none;filter:drop-shadow(0 8px 16px rgba(50,30,140,.35))}

.sign.bf{flex-direction:column;align-items:center;text-align:center;gap:4px;background:none;border:0;border-top:1px solid var(--bd);border-radius:0;padding:22px 4px 8px;margin-top:22px}
.sign.bf .brand{width:72px}
.sign.bf .org{font:700 calc(18px*var(--fs))/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin-top:4px}
.sign.bf .po{font-size:calc(12px*var(--fs));letter-spacing:.05em}
.sign.bf .slg{font-size:calc(13px*var(--fs));color:var(--tx);background:linear-gradient(transparent 58%,#8b7dff66 58%);padding:0 6px;margin-top:4px}
.sign.bf .abh{display:flex;align-items:center;gap:10px;width:100%;font-size:calc(12px*var(--fs));font-weight:500;letter-spacing:.04em;color:var(--mu);margin-top:16px}
.sign.bf .abh:before,.sign.bf .abh:after{content:"";flex:1;height:1px;background:var(--bd)}
.sign.bf .abt{font-size:calc(13px*var(--fs));margin:6px 0 0;max-width:520px;line-height:1.6}
.cht{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}.cht div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:.7rem;color:var(--mu)}.cht i{display:block;width:100%;max-width:28px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--ac),var(--ac2));min-height:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:10px}.cal-head{font-size:.68rem;color:var(--mu);text-align:center;padding-bottom:2px}.cal-day{min-height:64px;padding:7px 6px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:4px;cursor:pointer}.cal-day.muted{opacity:.42}.cal-day.today{border-color:var(--ac);box-shadow:inset 0 0 0 1px rgba(220,213,255,.6)}.cal-day.hit{background:linear-gradient(180deg,rgba(122,105,224,.18),rgba(164,149,255,.08));border-color:rgba(167,153,255,.7)}.cal-num{font-weight:700;font-size:.8rem;line-height:1}.cal-day small{font-size:.68rem;color:var(--mu);line-height:1.1}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;align-items:start}.module-grid>.g{margin:0}.module-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.module-card{background:var(--gl);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:10px 0}.module-card:last-child{margin-bottom:0}.module-card h3{margin:0;font:600 1rem/1.35 var(--serif)}.module-card p{margin:6px 0;color:var(--mu);font-size:.85rem;overflow-wrap:anywhere}.module-card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--mu);font-size:.78rem}.module-actions{display:flex;gap:6px;flex:none}.module-actions button{min-width:40px;min-height:40px;padding:6px 10px}.priority{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;background:var(--gl2);font-size:.74rem}.priority.high{color:#ffb0ca}.priority.medium{color:#ffe0a2}.priority.low{color:var(--mu)}.empty-state{padding:20px 10px;text-align:center;color:var(--mu)}.task-row{display:flex;gap:10px;align-items:flex-start;min-height:64px}.task-row input[type=checkbox]{margin-top:4px}.task-row .task-copy{flex:1;min-width:0}.task-row.done h3{text-decoration:line-through;color:var(--mu)}.habit-check{min-height:44px}.habit-streak{font-family:var(--serif);font-size:1.35rem;font-weight:600}.note-body{white-space:pre-wrap;overflow-wrap:anywhere;max-height:8em;overflow:hidden}.planner-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.planner-month .cal-day{min-height:90px;padding:6px 4px;border-radius:12px}.planner-month .event-dot{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.66rem;color:var(--tx)}.milestone{display:flex;align-items:flex-start;gap:8px;padding:6px 0}.milestone span{flex:1}.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.editor-grid label{display:block;min-width:0;font-size:.8rem;color:var(--mu)}.editor-grid label.wide{grid-column:1/-1}.editor-grid input,.editor-grid select,.editor-grid textarea{margin-top:4px}.editor-grid input,.editor-grid select{width:100%;min-height:44px;padding:9px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:inherit}.editor-grid textarea{min-height:88px}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick-grid .qb{margin:0;min-height:54px}.planner-day{border-top:1px solid var(--bd);padding:10px 0}.reminder-read{opacity:.62}
@media(max-width:1023px){#desktop-nav{display:none}}
#md .editor-dialog{max-width:680px;max-height:90vh;max-height:90dvh;overflow:auto}
.editor-grid select{color:var(--tx)}.editor-grid select option{background:var(--bg2);color:var(--tx)}
.home-extras{display:grid;grid-column:1/-1;gap:14px;margin-top:14px}.home-stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}.home-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.home-shortcuts button{min-height:44px}
.home-habit-list{display:grid;gap:2px;margin-top:6px}.home-habit-list .milestone{align-items:center;border-bottom:1px solid var(--bd)}.home-habit-list .milestone:last-child{border-bottom:0}.home-habit-copy{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.home-habit-copy span{overflow-wrap:anywhere}.home-habit-copy small{flex:none;color:var(--mu);font-size:.78rem}
.planner-month .cal-day{width:100%;text-align:left}.planner-month .event-dot{border:0;background:none;color:var(--mu);padding:0;min-height:0}.habit-calendar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:8px}.habit-calendar i{display:block;width:100%;height:8px;border-radius:8px;background:var(--tk)}.habit-calendar i.on{background:var(--ac)}
@media(min-width:700px){.home-extras{gap:18px}.home-extras>.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.home-extras>.module-grid>.g{margin:0}}
@media(max-width:480px){.editor-grid{grid-template-columns:minmax(0,1fr)}.editor-grid label.wide{grid-column:auto}.planner-month{gap:3px}.planner-month .cal-day{min-height:62px;padding:4px 3px;border-radius:9px}.planner-month .event-dot{display:none}.planner-month .cal-head{font-size:.62rem}.module-actions button{min-width:40px}}
.avatar-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.profile-picture{position:relative;width:92px;height:92px;border-radius:50%;overflow:hidden;border:2px solid var(--bd);background:var(--gl);display:grid;place-items:center;flex:none}.profile-picture .ic{width:44px;height:44px;color:var(--mu)}.ib>.avatar-photo{position:absolute;inset:0;width:100%;height:100%}.profile-picture-wrap{position:relative;flex:none}.profile-picture-label{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);white-space:nowrap;border-radius:999px;padding:1px 5px;background:var(--dk);color:var(--dkt);font-size:.58rem;line-height:1.35}.profile-picture>.avatar-photo{position:absolute;inset:0;width:100%;height:100%}
.g.ph,.g.ph:first-child{padding:16px 18px;border-top:1px solid var(--bd)}
.ss{width:100%;margin-top:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:inherit;font-size:calc(13px*var(--fs))}
.ss option{font-size:calc(13px*var(--fs))}
select option,select optgroup{background:var(--bg2);color:var(--tx)}
